services:
  collector:
    build: .
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./sessions:/app/sessions
    stdin_open: true
    tty: true
    command: python -m collector.main collect
  dashboard:
    build: .
    env_file: .env
    volumes:
      - ./data:/app/data
    ports:
      - "8501:8501"
    command: streamlit run dashboard.py --server.address 0.0.0.0
